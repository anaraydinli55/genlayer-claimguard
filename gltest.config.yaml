networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false

  studionet:
    url: "https://studio.genlayer.com/api"

  testnet_bradbury:
    url: "https://testnet.genlayer.foundation/api"
    accounts:
      - "${GENLAYER_PRIVATE_KEY}"
    from: "${GENLAYER_PRIVATE_KEY}"

paths:
  contracts: "contracts"
  artifacts: "artifacts"

environment: .env
